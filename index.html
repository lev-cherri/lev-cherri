<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="cherri — personal browser dashboard and neon home screen inspired by the reference design."
    />
    <title>cherri</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <aside class="dock" aria-label="Application dock">
        <button class="dock-icon active" aria-label="Home">
          <span>⌂</span>
        </button>
        <button class="dock-icon" aria-label="Apps">
          <span>◫</span>
        </button>
        <button class="dock-icon" aria-label="Files">
          <span>◌</span>
        </button>
        <button class="dock-icon" aria-label="Music">
          <span>♫</span>
        </button>
        <button class="dock-icon" aria-label="Messages">
          <span>✦</span>
        </button>
        <button class="dock-icon" aria-label="Settings">
          <span>⚙</span>
        </button>
      </aside>

      <main class="browser-window" aria-label="Browser home page">
        <header class="browser-topbar">
          <div class="topbar-left">
            <div class="status-pill">12:12 AM</div>
            <div class="back-stack">
              <span>◀</span>
            </div>
          </div>

          <div class="address-bar">
            <span class="address-icon">◢</span>
            <span class="address-text">chelmsfordrfc.com</span>
            <span class="address-actions">
              <span>↻</span>
              <span>⤴</span>
            </span>
          </div>

          <div class="topbar-right">
            <span class="utility-icon">⊕</span>
            <span class="utility-icon">▣</span>
          </div>
        </header>

        <div class="tab-row">
          <div class="tab tab-left">
            <span class="tab-glow"></span>
            <span class="tab-label">ArcadePulse</span>
            <span class="tab-separator">|</span>
            <span class="tab-muted">Base44</span>
            <span class="dismiss">×</span>
          </div>

          <div class="tab tab-center active">
            <span class="tab-logo">✦</span>
            <span>cherri</span>
          </div>

          <div class="tab tab-right">
            <span class="tab-logo subtle">◍</span>
            <span>Discord</span>
          </div>
        </div>

        <nav class="nav-strip" aria-label="Browser location navigation">
          <div class="home-pill">
            <span class="home-mark">⌂</span>
            <span>Home</span>
            <span class="x-mark">×</span>
          </div>
          <span class="plus-sign">＋</span>
        </nav>

        <div class="browser-address-row">
          <div class="browser-controls">
            <span>←</span>
            <span>→</span>
            <span>↻</span>
          </div>

          <div class="address-url">cherri://home</div>

          <div class="browser-tools">
            <span>⌁</span>
            <span>◫</span>
            <span>☆</span>
            <span>✦</span>
            <span>⋯</span>
          </div>
        </div>

        <section class="home-screen">
          <div class="hero-title-wrap">
            <h1 class="hero-title">cherri</h1>
            <p class="hero-subtitle">tech no night</p>
          </div>

          <div class="search-panel" role="search">
            <span class="search-icon">⌕</span>
            <span class="search-placeholder">Search for anything!</span>
            <button type="button" class="search-submit" aria-label="Search">→</button>
          </div>

          <div class="app-grid" aria-label="Applications">
            <button class="app-tile" type="button">
              <span class="app-icon">🎮</span>
              <span>Games</span>
            </button>
            <button class="app-tile" type="button">
              <span class="app-icon">◌</span>
              <span>AI</span>
            </button>
            <button class="app-tile" type="button">
              <span class="app-icon">♫</span>
              <span>Music</span>
            </button>
            <button class="app-tile" type="button">
              <span class="app-icon">💬</span>
              <span>Chat</span>
            </button>
            <button class="app-tile" type="button">
              <span class="app-icon">＋</span>
              <span>Add</span>
            </button>
            <button class="app-tile" type="button">
              <span class="app-icon">▣</span>
              <span>All Apps</span>
            </button>
          </div>

          <div class="status-row">
            <span class="status-pill status-users">
              <span class="mini-icon">◌</span>
              364 users online
            </span>
            <span class="status-pill status-discord">
              <span class="mini-icon">◉</span>
              Join our Discord for more links
            </span>
          </div>

          <div class="clock-card">
            <div class="clock-time" id="clock-time">12:12 AM</div>
            <div class="clock-date" id="clock-date">Wednesday, October 21</div>
          </div>
        </section>

        <div class="page-save">
          <span>Page: 257 ms</span>
          <span>v3.11.0 • f63c8a8-dirty</span>
        </div>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
